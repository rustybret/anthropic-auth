    applyThinkingBindingControls('''
new = '''  // NON-VACUITY BREAK: decorate API-key routes with an explicit override
  if (!identity) applyThinkingBindingControls(body, 'drop_block')
  if (identity) {
    applyThinkingBindingControls('''
test_file = "packages/pi/src/tests/convert.test.ts"
